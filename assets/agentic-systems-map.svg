<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PickBits Loop Atlas</title>
  <desc id="desc">Company OS observes six agentic domain loops. All loops share contracts, bounded authority, evidence gates, traces, receipts, evals, and human interrupts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#11162d"/>
    </linearGradient>
    <linearGradient id="company" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 3px; fill: #67e8f9; }
      .title { font: 800 32px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #a8b5c9; }
      .card-title { font: 750 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .loop { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #cbd5e1; }
      .proof { font: 650 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #dbeafe; }
      .small { font: 500 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#312e81" opacity=".16"/>
  <circle cx="110" cy="650" r="210" fill="#0e7490" opacity=".11"/>

  <text x="64" y="62" class="eyebrow">PICKBITS LOOP ATLAS</text>
  <text x="64" y="104" class="title">Production-shaped agent systems</text>
  <text x="64" y="133" class="subtitle">Inspectable graphs · bounded authority · gates proven able to fail · evidence that compounds</text>

  <rect x="388" y="162" width="424" height="86" rx="18" fill="#0d2238" stroke="url(#company)" stroke-width="2"/>
  <text x="420" y="196" class="card-title">Company OS</text>
  <text x="420" y="222" class="loop">observe → normalize → surface drift → escalate</text>
  <circle cx="775" cy="205" r="12" fill="#22d3ee" opacity=".9" filter="url(#glow)"/>

  <path d="M600 248 V278 M600 278 H211 V305 M600 278 H600 V305 M600 278 H989 V305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(64 305)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#1e7490"/>
    <text x="24" y="34" class="card-title">Weaver</text>
    <text x="24" y="63" class="loop">revise → invalidate</text>
    <text x="24" y="85" class="loop">→ rebuild → release ↺</text>
    <text x="24" y="106" class="small">narrative state as a build graph</text>
  </g>
  <g transform="translate(453 305)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#4f46e5"/>
    <text x="24" y="34" class="card-title">Newsroom</text>
    <text x="24" y="63" class="loop">retrieve → score → critique</text>
    <text x="24" y="85" class="loop">→ repair / escalate ↺</text>
    <text x="24" y="106" class="small">evidence-backed editorial decisions</text>
  </g>
  <g transform="translate(842 305)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#7c3aed"/>
    <text x="24" y="34" class="card-title">Warehouse</text>
    <text x="24" y="63" class="loop">contract → produce → verify</text>
    <text x="24" y="85" class="loop">→ approve → distribute ↺</text>
    <text x="24" y="106" class="small">proof-carrying production</text>
  </g>

  <path d="M211 425 V450 M600 425 V450 M989 425 V450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(64 458)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#0891b2"/>
    <text x="24" y="34" class="card-title">Sprite Generator</text>
    <text x="24" y="63" class="loop">manifest → generate → pack</text>
    <text x="24" y="85" class="loop">→ visual proof → receipt ↺</text>
    <text x="24" y="106" class="small">the public edge of Asset Factory</text>
  </g>
  <g transform="translate(453 458)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#6366f1"/>
    <text x="24" y="34" class="card-title">Infinite Arcade</text>
    <text x="24" y="63" class="loop">evidence → decision → authorize</text>
    <text x="24" y="85" class="loop">→ experiment → feedback ↺</text>
    <text x="24" y="106" class="small">human-gated product learning</text>
  </g>
  <g transform="translate(842 458)">
    <rect width="294" height="120" rx="16" fill="#101e31" stroke="#8b5cf6"/>
    <text x="24" y="34" class="card-title">University</text>
    <text x="24" y="63" class="loop">source → retrieve → teach</text>
    <text x="24" y="85" class="loop">→ evaluate → update ↺</text>
    <text x="24" y="106" class="small">curriculum with dependency state</text>
  </g>

  <rect x="64" y="622" width="1072" height="56" rx="14" fill="#0b2940" stroke="#164e63"/>
  <text x="88" y="646" class="eyebrow">SHARED PROOF BOUNDARY</text>
  <text x="88" y="665" class="proof">contracts · explicit authority · evidence gates · traces + receipts · human interrupts · deterministic evals</text>
</svg>
